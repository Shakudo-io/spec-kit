# Workspace Configuration for Multi-Repository Spec-Kit Setup
# =============================================================
#
# This file enables workspace mode for managing specs across multiple
# repositories in a single workspace directory.
#
# Place this file at:
#   - {workspace}/.specify/workspace.yaml (installed)
#   - {workspace}/workspace.yaml (alternative)
#
# For more information, see: https://github.com/github/spec-kit

# Configuration version
version: "1.0"

# Spec Storage Strategy
# ---------------------
# centralized: All specs stored in {workspace}/specs/{project}/{feature}/
#              Recommended for most workspaces. Single location for all specs.
# distributed: Specs stored in each repo at {repo}/specs/{feature}/
#              Use when repos need self-contained specs.
spec_strategy: centralized

# Centralized Specs Directory
# ---------------------------
# Only used when spec_strategy is "centralized"
# Default: {workspace}/specs
# specs_dir: "{workspace}/specs"

# Branch Naming Prefix
# --------------------
# When true, feature branches include project name: project-001-feature
# When false, branches use legacy format: 001-feature
# Default: true (recommended for workspace mode)
branch_prefix: "{project}"

# Behavior When No Project Specified
# ----------------------------------
# What to do when --project is not provided in workspace mode:
#   error: Fail with error message and list available projects (safest)
#   prompt: Interactive prompt to select project (requires TTY)
#   current: Use current directory name as project (convenience)
# Default: error
no_project_behavior: error

# Constitution Location
# ---------------------
# Where to look for the shared constitution file:
#   workspace: Use {workspace}/.specify/memory/constitution.md (shared)
#   project: Use {project}/.specify/memory/constitution.md (per-repo)
# Default: workspace
constitution_location: workspace

# Archived Projects
# -----------------
# Projects listed here are excluded from workspace discovery, rollups,
# and spec listings. Use /speckit.archive to manage this list.
# Archived projects remain on disk but are hidden from active workflows.
# Example:
#   archived_projects:
#     - old-backend-api
#     - deprecated-service
archived_projects: []

# ============================================================
# PROJECT DISCOVERY
# ============================================================
#
# The workspace automatically discovers projects by looking for:
# 1. Directories with .git folders (git repositories)
# 2. Directories with .specify folders (spec-kit initialized)
#
# Excluded patterns (always skipped):
#   node_modules, .git, .specify, .opencode, specs,
#   __pycache__, .venv, venv, scripts, templates, memory, docs, media

# ============================================================
# AI AGENT DISCOVERY
# ============================================================
#
# When starting in a workspace, AI agents should run:
#
#   .specify/scripts/bash/check-prerequisites.sh --workspace-info
#
# This returns JSON with available projects and features:
#   {
#     "workspace_mode": true,
#     "workspace_root": "/path/to/workspace",
#     "projects": ["repo1", "repo2"],
#     "features": ["repo1-001", "repo2-001"]
#   }
#
# List projects only:
#   .specify/scripts/bash/check-prerequisites.sh --list-projects
#
# List projects as JSON:
#   .specify/scripts/bash/check-prerequisites.sh --list-projects --json

# ============================================================
# USAGE EXAMPLES
# ============================================================
#
# Creating a feature in workspace mode:
#
#   /speckit.specify --project myrepo "Add authentication"
#
#   # Result:
#   # - Branch: myrepo-001-authentication (in myrepo)
#   # - Specs: {workspace}/specs/myrepo/001-authentication/
#
# Working with features using shorthand:
#
#   # List all features
#   .specify/scripts/bash/check-prerequisites.sh --list-features
#
#   # Work on a specific feature
#   /speckit.plan myrepo-001
#   /speckit.tasks myrepo-001
#   /speckit.implement myrepo-001
#
# ============================================================
